# The phone-side tools this port installs live on iOS 26 (arm64e, pacstrip), built on a macOS runner because it needs Xcode's iPhoneOS SDK.
# Same commands as tools/sweetnet/build.sh. Only our own source goes into the artifact.
name: phone tools (iOS 26)

on:
  workflow_dispatch:
  push:
    branches: [poco-f1]
    paths:
      - .github/workflows/sweetuicache.yml
      - tools/sweetnet/sweetuicache.m
      - tools/sweetnet/uicache.entitlements
      - tools/sweetnet/sweettorch.m
      - tools/audio/SweetSpeaker/**

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        run: |
          mkdir -p out
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=18.0 -O2 -fobjc-arc \
            -framework Foundation -framework Security tools/sweetnet/sweetuicache.m -o out/sweetuicache
          codesign -s - -f --entitlements tools/sweetnet/uicache.entitlements out/sweetuicache
          python3 -I tools/renegade/pacstrip.py --sign out/sweetuicache
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=18.0 -O2 -Wall tools/sweetnet/sweetsys.c -o out/sweetsys
          codesign -s - -f --entitlements tools/sweetnet/entitlements.plist out/sweetsys
          python3 -I tools/renegade/pacstrip.py --sign out/sweetsys
          # same commands as tools/sweetnet/build.sh and tools/audio/SweetSpeaker/build.sh
          P=tools/renegade/pacstrip.py
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=18.0 -O2 -Wall -Wno-objc-designated-initializers -fobjc-arc \
            -dynamiclib -install_name /usr/local/lib/sweettorch.dylib -framework Foundation tools/sweetnet/sweettorch.m -o out/sweettorch.dylib
          codesign -s - -f out/sweettorch.dylib
          python3 -I $P --sign out/sweettorch.dylib
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=18.0 -O2 -Wall -fobjc-arc -framework Foundation \
            -framework CoreHaptics tools/sweetnet/sweethaptic.m -o out/sweethaptic
          codesign -s - -f --entitlements tools/sweetnet/entitlements.plist out/sweethaptic
          python3 -I $P --sign out/sweethaptic
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=18.0 -O2 -Wall -framework AudioToolbox tools/sweetnet/sweetvibe.c -o out/sweetvibe
          codesign -s - -f --entitlements tools/sweetnet/entitlements.plist out/sweetvibe
          python3 -I $P --sign out/sweetvibe
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=18.0 -O2 -fobjc-arc -framework Foundation tools/sweetnet/sweetlog.m -o out/sweetlog
          codesign -s - -f --entitlements tools/sweetnet/log.entitlements out/sweetlog
          python3 -I $P --sign out/sweetlog
          # tools/audio/SweetSpeaker/build.sh, plus the plug-in header: Apple ships it in the macOS SDK only.
          # It is used on this runner while compiling and is not part of the artifact.
          INC=$PWD/inc
          mkdir -p "$INC/CoreAudio" out/SweetSpeaker.driver
          cp "$(xcrun --sdk macosx --show-sdk-path)"/System/Library/Frameworks/CoreAudio.framework/Headers/*.h "$INC/CoreAudio/"
          cp tools/audio/SweetSpeaker/Info.plist out/SweetSpeaker.driver/Info.plist
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=26.0 -O2 -Wall -Wextra -bundle -idirafter "$INC" \
            -framework CoreAudio -framework CoreFoundation tools/audio/SweetSpeaker/SweetSpeaker.c tools/audio/SweetSpeaker/guard.c \
            -o out/SweetSpeaker.driver/SweetSpeaker
          python3 -I $P --sign out/SweetSpeaker.driver/SweetSpeaker
          codesign -s - -f out/SweetSpeaker.driver
          ls -lR out
          shasum -a 256 out/* out/SweetSpeaker.driver/SweetSpeaker || true

      - uses: actions/upload-artifact@v4
        with:
          name: phone-tools
          path: out/
          retention-days: 30